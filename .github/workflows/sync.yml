name: Sync Itch.io & YouTube Data

on:
  schedule:
    # Se ejecuta cada 2 horas (a las 00:00, 02:00, 04:00, 06:00, 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00)
    - cron: '0 */2 * * *'
  # Permite ejecutarlo manualmente desde la pestania Actions de GitHub con un solo clic
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ejecutar Script de Sincronizacion
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node tools/sync_data.js

      - name: Guardar cambios si hay actualizaciones
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/json/*.json ads/youplanner_ads.json sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-sync Itch.io games and YouTube videos [skip ci]"
            git pull --rebase origin main
            pushed=0
            for i in 1 2 3; do
              echo "Intento de push $i de 3..."
              if git push origin main; then
                pushed=1
                break
              fi
              echo "Aviso: Fallo temporal en push. Esperando 5 segundos antes de reintentar..."
              sleep 5
            done
            if [ $pushed -ne 1 ]; then
              echo "Error: No se pudo completar el push tras 3 intentos."
              exit 1
            fi
          else
            echo "No hay cambios nuevos para sincronizar."
          fi
