<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Ambient Glow Circles -->
  <circle cx="280" cy="240" r="220" fill="#8b5cf6" opacity="0.15" />
  <circle cx="1000" cy="460" r="260" fill="#ec4899" opacity="0.12" />

  <!-- Central Frame / App Showcase -->
  <rect x="200" y="110" width="880" height="490" rx="20" fill="#131127" stroke="rgba(255,255,255,0.12)" stroke-width="2" filter="url(#shadow)" />

  <!-- Mockup Top Bar -->
  <rect x="200" y="110" width="880" height="48" rx="20" fill="#1c1936" />
  <rect x="200" y="140" width="880" height="18" fill="#1c1936" />
  <circle cx="230" cy="134" r="6" fill="#ef4444" />
  <circle cx="250" cy="134" r="6" fill="#eab308" />
  <circle cx="270" cy="134" r="6" fill="#22c55e" />
  <rect x="380" y="122" width="520" height="24" rx="6" fill="#0d0b1a" />
  <text x="640" y="138" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">https://editfun.eternodev.com</text>

  <!-- 5 Tools Visual Blocks inside Showcase -->
  <!-- Tool 1: GoogleFake -->
  <rect x="240" y="180" width="240" height="170" rx="12" fill="#1e1a38" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5" />
  <text x="260" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#38bdf8">GoogleFake</text>
  <rect x="260" y="235" width="200" height="26" rx="13" fill="#0f0d1e" />
  <text x="275" y="252" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Search query animation...</text>
  <text x="260" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#a78bfa">Simulador de Busqueda</text>

  <!-- Tool 2: 999k Views -->
  <rect x="520" y="180" width="240" height="170" rx="12" fill="#1e1a38" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1.5" />
  <text x="540" y="215" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#f43f5e">999,999 Views</text>
  <text x="540" y="250" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#ffffff">999,999</text>
  <rect x="540" y="268" width="200" height="8" rx="4" fill="#0f0d1e" />
  <rect x="540" y="268" width="160" height="8" rx="4" fill="#f43f5e" />
  <text x="540" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#f472b6">Metricas de YouTube</text>

  <!-- Tool 3: BSOD Error -->
  <rect x="800" y="180" width="240" height="170" rx="12" fill="#0078d7" opacity="0.9" />
  <text x="820" y="220" font-family="'Segoe UI', sans-serif" font-size="34" font-weight="300" fill="#ffffff">:(</text>
  <text x="820" y="260" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="400" fill="#ffffff">Your PC ran into a problem</text>
  <text x="820" y="285" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#dbeafe">CRITICAL_PROCESS_DIED</text>
  <text x="820" y="325" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Windows Errors</text>

  <!-- Tool 4: Comments -->
  <rect x="240" y="375" width="380" height="180" rx="12" fill="#1e1a38" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  <circle cx="275" cy="415" r="16" fill="#ec4899" />
  <text x="275" y="421" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">E</text>
  <text x="305" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#ffffff">@EternoDev</text>
  <rect x="390" y="405" width="45" height="16" rx="3" fill="#38bdf8" />
  <text x="412" y="416" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">CREATOR</text>
  <text x="305" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">Generador fiel de comentarios de YouTube</text>
  <text x="260" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#a78bfa">Edit Comments (PNG / SVG)</text>

  <!-- Tool 5: Time Up -->
  <rect x="660" y="375" width="380" height="180" rx="12" fill="#1e1a38" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
  <rect x="685" y="395" width="330" height="50" rx="8" fill="#0b0914" />
  <text x="850" y="432" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#22c55e" text-anchor="middle" letter-spacing="4">00:10:00</text>
  <text x="685" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#cbd5e1">Temporizador digital con curva de velocidad</text>
  <text x="685" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#4ade80">Time Up &amp; Stopwatch 1x-100x</text>

  <!-- Footer Tagline -->
  <text x="640" y="650" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="26" font-weight="800" fill="#ffffff" text-anchor="middle">EditFun - Suite de Herramientas para Creadores</text>
  <text x="640" y="682" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#94a3b8" text-anchor="middle">1280 x 720 (16:9) - EternoDev</text>
</svg>
