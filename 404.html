<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada - EternoDev</title>
  <link rel="icon" type="image/png" sizes="192x192" href="src/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #1D1D26;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .error-code {
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 900;
      color: #FDD31D;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 800;
      margin-bottom: 12px;
    }
    .error-desc {
      color: #CCCCCE;
      max-width: 480px;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-home {
      background: #FDD31D;
      color: #1D1D26;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 8px;
      transition: opacity 0.15s ease;
      display: inline-block;
    }
    .btn-home:hover {
      opacity: 0.9;
    }
  </style>
  <script>
    // Si viene de una ruta SPA de GitHub Pages, redirige a la raíz
    var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
    if (path && path !== '404' && path !== '404.html') {
      sessionStorage.setItem('spa_redirect', path);
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <div class="error-code">404</div>
  <h1 class="error-title">Página no encontrada</h1>
  <p class="error-desc">La ruta a la que intentas acceder no existe o ha sido movida. Puedes volver al inicio para explorar videojuegos, aplicaciones y vídeos.</p>
  <a href="/" class="btn-home">Volver al Inicio</a>
</body>
</html>
